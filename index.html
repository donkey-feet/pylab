<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Jebediah's Python Lab</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
    textarea { width: 100%; height: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    pre { padding: 12px; border: 1px solid #ddd; border-radius: 8px; min-height: 80px; white-space: pre-wrap; }
    button { padding: 10px 14px; font-size: 14px; }
    .row { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
  </style>
</head>

<body>
  <h1>Jebediah's Python Lab</h1>

  <p>Type Python below and click Run.</p>

  <textarea id="code">print("hello!")</textarea>

  <div class="row">
    <button id="run">Run</button>
    <button id="clear">Clear output</button>
  </div>

  <h3>Output</h3>
  <pre id="output">Ready.</pre>

  <script type="py">
<script type="py">
from js import document
from pyodide.ffi import create_proxy
import traceback

code_el = document.getElementById("code")
out_el = document.getElementById("output")
run_btn = document.getElementById("run")
clear_btn = document.getElementById("clear")

def set_output(text):
    out_el.innerText = text

def append_output(text):
    out_el.innerText += text

def run_code(event=None):
    set_output("")
    src = code_el.value

    def page_print(*args, sep=" ", end="\n"):
        append_output(sep.join(str(a) for a in args) + end)

    env = {"print": page_print}

    try:
        exec(src, env, env)
    except Exception:
        append_output(traceback.format_exc())

def clear_output(event=None):
    set_output("Ready.")

run_btn.addEventListener("click", create_proxy(run_code))
clear_btn.addEventListener("click", create_proxy(clear_output))
</script>
  </script>
</body>
</html>
