<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diablo 4 Unique Item Drop Reference Guide</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --accent-gold: #ffcc00;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .description {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .controls-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .search-container {
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            background-color: #121212;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .filter-label {
            font-weight: bold;
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            margin-right: 5px;
        }

        .class-select {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .class-select:focus {
            border-color: var(--accent-gold);
        }

        .table-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        th {
            background-color: #171717;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background-color: #252525;
        }

        .item-name {
            font-weight: bold;
            color: var(--accent-gold);
            font-size: 0.95rem;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: bold;
        }

        .badge-class { background-color: #2a2a2a; color: #e0e0e0; border: 1px solid #444; }

        .counter {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 15px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Diablo 4 Unique Drop Reference Guide</h1>
    <p class="description">Alphabetical Reference Sheet for Boss Lairs, Season 15 Capstones, General Pool, and Cube Crafting</p>

    <div class="controls-card">
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by Unique Name, Drop Source, Boss, or Class..." oninput="filterTable()">
        </div>

        <div class="filter-row">
            <div class="filter-group">
                <span class="filter-label">Filter Class:</span>
                <select id="classSelect" class="class-select" onchange="filterTable()">
                    <option value="all">All Classes</option>
                    <option value="barbarian">Barbarian</option>
                    <option value="druid">Druid</option>
                    <option value="necromancer">Necromancer</option>
                    <option value="rogue">Rogue</option>
                    <option value="sorcerer">Sorcerer</option>
                    <option value="spiritborn">Spiritborn</option>
                    <option value="paladin">Paladin</option>
                    <option value="warlock">Warlock</option>
                    <option value="all classes">Universal / All Classes Only</option>
                </select>
            </div>
        </div>

        <div class="counter" id="itemCount">Showing all items</div>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>Unique Item Name</th>
                    <th>Class Match</th>
                    <th>Primary Drop Source / Boss</th>
                </tr>
            </thead>
            <tbody id="uniqueTableBody"></tbody>
        </table>
    </div>
</div>

uniquesData.sort((a, b) => a.name.localeCompare(b.name));

function renderTable(data) {
    const tbody = document.getElementById('uniqueTableBody');
    const counter = document.getElementById('itemCount');
    
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 30px; color:#888;">No unique items match your search query or class filter.</td></tr>';
        counter.textContent = 'Showing 0 items';
        return;
    }

    let html = '';
    data.forEach(item => {
        html += `
            <tr>
                <td class="item-name">${item.name}</td>
                <td><span class="badge badge-class">${item.class}</span></td>
                <td>${item.source}</td>
            </tr>
        `;
    });

    tbody.innerHTML = html;
    counter.textContent = `Showing ${data.length} of ${uniquesData.length} items`;
}

function filterTable() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const classFilter = document.getElementById('classSelect').value.toLowerCase();

    const filtered = uniquesData.filter(item => {
        let matchesClass = true;
        if (classFilter !== 'all') {
            matchesClass = item.class.toLowerCase().includes(classFilter) || item.class.toLowerCase().includes('all classes');
        }

        const matchesQuery = 
            item.name.toLowerCase().includes(query) ||
            item.class.toLowerCase().includes(query) ||
            item.source.toLowerCase().includes(query);

        return matchesClass && matchesQuery;
    });

    renderTable(filtered);
}

renderTable(uniquesData);
